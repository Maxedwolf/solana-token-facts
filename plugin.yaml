name: solana-token-facts
version: 0.1.0
description: >-
  Solana token facts from on-chain data (read-only on-chain): mint and freeze authority,
  supply, Token vs Token-2022 and risky extensions, top holders and supply
  concentration, creation time, creator wallet and launchpad, and a developer's past
  launches (graduated, dev sold out, timing), recent pump.fun -> PumpSwap graduations. Optional dev reports saved as
  local Markdown notes (e.g. an Obsidian vault). /token slash command. No trading, no wallet keys.
  Disclosure: makes outbound HTTPS JSON-RPC calls to a Solana RPC endpoint
  (default https://api.mainnet-beta.solana.com, configurable via rpc_url).
author: Maxed Wolf
license: MIT
homepage: https://github.com/Maxedwolf/solana-token-facts
requires_hermes: ">=0.22.6"
manifest_version: 2
api_version: 1
tags: [solana, blockchain, read-only, tokens]

# Must list EXACTLY the tools register() registers. Add the others as we build them.
provides_tools:
  - token_authorities
  - token_origin
  - token_holders
  - dev_launches
  - save_dev_report
  - recent_graduations

config_schema:
  rpc_url:
    type: str
    default: "https://api.mainnet-beta.solana.com"
    label: "Solana RPC URL"
    description: "HTTPS JSON-RPC endpoint used for all lookups. Free public mainnet RPC by default. token_holders needs a provider URL (many have free tiers)."
  origin_max_pages:
    type: int
    default: 10
    label: "History scan limit (token_origin)"
    description: "Max pages of 1,000 transactions token_origin reads to find a token's first transaction (only used when the RPC lacks getTransactionsForAddress). Higher = more RPC credits."
  dev_max_launches:
    type: int
    default: 5
    label: "Dev history: launches to report"
    description: "How many of a developer's most recent launches dev_launches reports (1-1000)."
  dev_max_pages:
    type: int
    default: 5
    label: "Dev history: scan limit"
    description: "Max pages of 100 full transactions dev_launches scans per dev (about 10 Helius credits per page). Raise for very active devs."
  reports_dir:
    type: str
    default: ""
    label: "Dev reports folder"
    description: "Where save_dev_report writes Markdown notes (e.g. a folder inside your Obsidian vault). Empty = Hermes plugin-data/solana-token-facts/dev-reports."
