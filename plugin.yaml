name: solana-token-facts
version: 0.1.0
description: >-
  Read-only Solana token facts from on-chain data: mint and freeze authority,
  supply, Token vs Token-2022 and risky extensions, top holders and supply
  concentration, creation time, creator wallet and launchpad. No trading, no wallet keys.
  Disclosure: makes outbound HTTPS JSON-RPC calls to a Solana RPC endpoint
  (default https://api.mainnet-beta.solana.com, configurable via rpc_url).
author: Maxed Wolf
license: MIT
homepage: https://github.com/Maxedwolf/solana-token-facts
requires_hermes: ">=0.22.6"
manifest_version: 2
api_version: 1
tags: [solana, blockchain, read-only, tokens]

# Must list EXACTLY the tools register() registers. Add the others as we build them.
provides_tools:
  - token_authorities
  - token_origin
  - token_holders

config_schema:
  rpc_url:
    type: str
    default: "https://api.mainnet-beta.solana.com"
    label: "Solana RPC URL"
    description: "HTTPS JSON-RPC endpoint used for all lookups. Free public mainnet RPC by default. token_holders needs a provider URL (many have free tiers)."
  origin_max_pages:
    type: int
    default: 10
    label: "History scan limit (token_origin)"
    description: "Max pages of 1,000 transactions token_origin reads to find a token's first transaction. Higher = more RPC credits."
